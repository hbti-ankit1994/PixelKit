<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="pkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14172a"/>
      <stop offset="45%" stop-color="#0f1122"/>
      <stop offset="100%" stop-color="#070811"/>
    </linearGradient>

    <linearGradient id="pkBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.28)"/>
      <stop offset="35%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="70%" stop-color="rgba(99, 102, 241, 0.25)"/>
      <stop offset="100%" stop-color="rgba(236, 72, 153, 0.35)"/>
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="ambGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#ec4899" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="opticGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#a5b4fc" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b0d1b" stop-opacity="0"/>
    </radialGradient>

    <!-- Aperture Blades: 6 Vivid Vibrant Gradients -->
    <linearGradient id="bld1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="bld2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="bld3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="bld4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="bld5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="bld6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Pixel Tile Gradients -->
    <linearGradient id="pxConv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="pxFilt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="pxMeme" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="pxColl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="pkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="glowFilt" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#6366f1" flood-opacity="0.5"/>
    </filter>
    <filter id="bladeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#pkBg)" filter="url(#pkShadow)"/>
  <rect x="25" y="25" width="462" height="462" rx="111" fill="none" stroke="url(#pkBorder)" stroke-width="2"/>

  <!-- Inner Ambient Bloom -->
  <circle cx="256" cy="256" r="185" fill="url(#ambGlow)"/>

  <!-- Geometric Optical Coordinate Rings -->
  <g opacity="0.16" stroke="#ffffff" stroke-width="1.5">
    <circle cx="256" cy="256" r="172" fill="none" stroke-dasharray="3 6"/>
    <circle cx="256" cy="256" r="112" fill="none" stroke-dasharray="2 5"/>
    <!-- Cardinal Crosshairs -->
    <line x1="84" y1="256" x2="134" y2="256" stroke-linecap="round"/>
    <line x1="378" y1="256" x2="428" y2="256" stroke-linecap="round"/>
    <line x1="256" y1="84" x2="256" y2="134" stroke-linecap="round"/>
    <line x1="256" y1="378" x2="256" y2="428" stroke-linecap="round"/>
  </g>

  <!-- Light Conduits (connecting satellite pixel modules to lens) -->
  <g opacity="0.25" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="135" y1="135" x2="195" y2="195"/>
    <line x1="377" y1="135" x2="317" y2="195"/>
    <line x1="377" y1="377" x2="317" y2="317"/>
    <line x1="135" y1="377" x2="195" y2="317"/>
  </g>

  <!-- 4 Satellite Pixel Modules (Convert, Filter, Meme, Collage) -->
  <!-- Module 1: Image Converter (Top-Left) -->
  <g filter="url(#glowFilt)">
    <rect x="94" y="94" width="48" height="48" rx="14" fill="url(#pxConv)"/>
    <rect x="95" y="95" width="46" height="46" rx="13" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <!-- Convert Arrow Glyphs -->
    <path d="M110 114h16m-4-4l4 4-4 4M126 122h-16m4-4l-4 4 4 4" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Module 2: Filter Studio (Top-Right) -->
  <g filter="url(#glowFilt)">
    <rect x="370" y="94" width="48" height="48" rx="14" fill="url(#pxFilt)"/>
    <rect x="371" y="95" width="46" height="46" rx="13" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <!-- Spark / Filter Wand Glyph -->
    <path d="M394 107v6m0 10v6m-11-11h6m10 0h6m-17-6l4 4m10 10l4 4m0-18l-4 4m-10 10l-4 4" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Module 3: Meme Generator (Bottom-Right) -->
  <g filter="url(#glowFilt)">
    <rect x="370" y="370" width="48" height="48" rx="14" fill="url(#pxMeme)"/>
    <rect x="371" y="371" width="46" height="46" rx="13" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <!-- Chat/Meme Bubble Glyph -->
    <path d="M386 386h16a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-5l-4 4v-4h-7a3 3 0 0 1-3-3v-8a3 3 0 0 1 3-3z" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Module 4: Collage Maker (Bottom-Left) -->
  <g filter="url(#glowFilt)">
    <rect x="94" y="370" width="48" height="48" rx="14" fill="url(#pxColl)"/>
    <rect x="95" y="371" width="46" height="46" rx="13" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <!-- Collage Quad Tiles Glyph -->
    <rect x="107" y="383" width="9" height="9" rx="2" fill="#ffffff" opacity="0.95"/>
    <rect x="120" y="383" width="9" height="9" rx="2" fill="#ffffff" opacity="0.95"/>
    <rect x="107" y="396" width="9" height="9" rx="2" fill="#ffffff" opacity="0.95"/>
    <rect x="120" y="396" width="9" height="9" rx="2" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Central Camera Lens Chassis -->
  <circle cx="256" cy="256" r="146" fill="#131627" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>
  <circle cx="256" cy="256" r="138" fill="#090b16"/>

  <!-- Rotating Aperture Blades (6 Interlocking Precision Blades) -->
  <g transform="translate(256, 256)" filter="url(#bladeShadow)">
    <!-- Blade 1: Cyan to Indigo -->
    <path d="M 0,-126 A 126 126 0 0 1 109,-63 L 40,-23 A 46 46 0 0 0 0,-46 Z" fill="url(#bld1)"/>
    <path d="M 0,-126 L 40,-23" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

    <!-- Blade 2: Indigo to Purple -->
    <path d="M 109,-63 A 126 126 0 0 1 109,63 L 40,23 A 46 46 0 0 0 40,-23 Z" fill="url(#bld2)"/>
    <path d="M 109,-63 L 40,23" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

    <!-- Blade 3: Purple to Pink -->
    <path d="M 109,63 A 126 126 0 0 1 0,126 L 0,46 A 46 46 0 0 0 40,23 Z" fill="url(#bld3)"/>
    <path d="M 109,63 L 0,46" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

    <!-- Blade 4: Pink to Orange -->
    <path d="M 0,126 A 126 126 0 0 1 -109,63 L -40,23 A 46 46 0 0 0 0,46 Z" fill="url(#bld4)"/>
    <path d="M 0,126 L -40,23" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

    <!-- Blade 5: Orange to Gold -->
    <path d="M -109,63 A 126 126 0 0 1 -109,-63 L -40,-23 A 46 46 0 0 0 -40,23 Z" fill="url(#bld5)"/>
    <path d="M -109,63 L -40,-23" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

    <!-- Blade 6: Emerald to Cyan -->
    <path d="M -109,-63 A 126 126 0 0 1 0,-126 L 0,-46 A 46 46 0 0 0 -40,-23 Z" fill="url(#bld6)"/>
    <path d="M -109,-63 L 0,-46" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  </g>

  <!-- Central Optical Core -->
  <circle cx="256" cy="256" r="46" fill="#070813"/>
  <circle cx="256" cy="256" r="46" fill="url(#opticGlow)"/>
  <circle cx="256" cy="256" r="46" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>

  <!-- High-Intensity 4-point Lens Flare Sparkle -->
  <path d="M 256,218 Q 256,256 218,256 Q 256,256 256,294 Q 256,256 294,256 Q 256,256 256,218 Z" fill="#ffffff" filter="drop-shadow(0 0 8px #ffffff)"/>
  <circle cx="256" cy="256" r="4" fill="#ffffff"/>

  <!-- Glass Sheen / Specular Highlights across top curved glass -->
  <path d="M 46,120 C 70,68 116,36 170,26 C 105,42 60,78 46,120 Z" fill="#ffffff" opacity="0.22"/>
  <path d="M 256,124 A 138 138 0 0 0 144,182 C 172,154 212,136 256,136 C 300,136 340,154 368,182 A 138 138 0 0 0 256,124 Z" fill="#ffffff" opacity="0.25"/>
</svg>