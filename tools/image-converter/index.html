"use strict";
const $ = id => document.getElementById(id);

/* ---------- format table ---------- */
const FORMATS = {
  png:  {label:"PNG",  ext:"png",  mime:"image/png",  alpha:true},
  jpeg: {label:"JPEG", ext:"jpg",  mime:"image/jpeg", alpha:false, quality:true},

  tiff: {label:"TIFF", ext:"tif",  mime:"image/tiff", alpha:true,  custom:true},

/* ---------- helpers ---------- */
const toBlob = (c, mime, q) => new Promise(r => c.toBlob(r, mime, q));
const u32 = (dv, o, v) => dv.setUint32(o, v, true);
function hexToRgb(h){ const n = parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function fmtSize(n){ return n<1024 ? n+" B" : n<1048576 ? (n/1024).toFixed(1)+" KB" : (n/1048576).toFixed(2)+" MB"; }

function makeCanvas(img, scale, w, h){
  const c = document.createElement("canvas");
  c.width = w ?? Math.max(1, Math.round(img.naturalWidth * scale));
  c.height = h ?? Math.max(1, Math.round(img.naturalHeight * scale));
  return c;
}
function drawOn(img, canvas, bg){
  const ctx = canvas.getContext("2d", {willReadFrequently:true});
  if (bg){ ctx.fillStyle = bg; ctx.fillRect(0,0,canvas.width,canvas.height); }
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  return ctx;
}

/* ---------- BMP (32-bit BGRA, V4 header, top-down) ---------- */
const hasAlphaPx = px => { for (let i=3;i<px.length;i+=4) if (px[i] !== 255) return true; return false; };

function encodeBMP24(px, w, h){ // opaque images: 24-bit BGR, 25% smaller than 32-bit
  const stride = (w*3+3) & ~3, size = stride*h, off = 14+40;
  const buf = new ArrayBuffer(off+size), dv = new DataView(buf), b = new Uint8Array(buf);
  b[0]=0x42; b[1]=0x4D; u32(dv,2,off+size); u32(dv,10,off);
  u32(dv,14,40); dv.setInt32(18,w,true); dv.setInt32(22,-h,true);
  dv.setUint16(26,1,true); dv.setUint16(28,24,true); u32(dv,34,size); u32(dv,38,2835); u32(dv,42,2835);

    let i = y*w*4, o = off + y*stride;
    for (let x=0;x<w;x++,i+=4,o+=3){ b[o]=px[i+2]; b[o+1]=px[i+1]; b[o+2]=px[i]; }

  return new Blob([buf],{type:"image/bmp"});
}

function encodeBMP(ctx, w, h){
  const px = ctx.getImageData(0,0,w,h).data;
  if (!hasAlphaPx(px)) return encodeBMP24(px, w, h);

  const buf = new ArrayBuffer(off+size), dv = new DataView(buf), b = new Uint8Array(buf);
  b[0]=0x42; b[1]=0x4D; u32(dv,2,off+size); u32(dv,10,off);
  u32(dv,14,108); dv.setInt32(18,w,true); dv.setInt32(22,-h,true);
  dv.setUint16(26,1,true); dv.setUint16(28,32,true); u32(dv,30,3); u32(dv,34,size);

  dv.setUint16(8,n,true);

/* ---------- state / UI ---------- */
const items = []; // {file,img,url,out:{blob,name,url}}
const fmtSel = $("fmt");

async function init(){

    let ok = true;
    if (F.probe){ const c=document.createElement("canvas"); c.width=c.height=1; const b=await toBlob(c,F.mime); ok = !!b && b.type===F.mime; }
    if (ok) fmtSel.add(new Option(F.label+" (."+F.ext+")", k));

}
function updateOpts(){
  const k = fmtSel.value, F = FORMATS[k];
  const tm = $("mode").value === "target";
  $("modeWrap").hidden = !F.quality;
  $("qWrap").hidden = !F.quality || tm;
  $("tWrap").hidden = !F.quality || !tm;
  $("bgWrap").hidden = F.alpha;

  $("pngWrap").hidden = k!=="png";

    png:"Full colour is lossless, so photos can still be several times larger than JPEG. \"256 colours\" is far smaller (like TinyPNG) but lossy and may show banding in photos; it is ideal for logos and screenshots.",
    webp:"WebP is typically 25–35% smaller than JPEG at similar quality. Lower the quality slider to shrink further.",
    avif:"AVIF gives the smallest files for photos, but encoding is slower.",

function clearOut(it){ if (it.out){ URL.revokeObjectURL(it.out.url); it.out=null; } it.status=null; }

const MAX_FILE_MB = 25, MAX_MEGAPIXELS = 50, MAX_BATCH_MB = 200;
$("limits").textContent = `Limits: ${MAX_FILE_MB} MB and ${MAX_MEGAPIXELS} megapixels per image, ${MAX_BATCH_MB} MB in total`;
const batchBytes = () => items.reduce((s,it) => s + it.file.size, 0);

async function addFiles(files){
  const rejected = [];
  for (const file of files){
    if (!file.type.startsWith("image/") && !/\.(tiff?|ico|bmp|avif|webp|svg)$/i.test(file.name)) continue;
    if (file.size > MAX_FILE_MB*1048576){
      rejected.push(`${file.name}: ${fmtSize(file.size)} exceeds the ${MAX_FILE_MB} MB limit`); continue;
    }
    if (batchBytes() + file.size > MAX_BATCH_MB*1048576){
      rejected.push(`${file.name}: adding it would exceed the ${MAX_BATCH_MB} MB total limit (remove some images or click Clear)`); continue;
    }
    const url = URL.createObjectURL(file), img = new Image();
    const it = {file, url, img, out:null, status:null};
    img.src = url;
    try {
      await img.decode();
      if(!img.naturalWidth) img.width=512, Object.defineProperty(img,"naturalWidth",{value:512}), Object.defineProperty(img,"naturalHeight",{value:512});
      const mp = img.naturalWidth*img.naturalHeight/1e6;
      if (mp > MAX_MEGAPIXELS){
        URL.revokeObjectURL(url);
        rejected.push(`${file.name}: ${mp.toFixed(0)} MP exceeds the ${MAX_MEGAPIXELS} MP limit`); continue;
      }
    } catch { it.status = {err:true,msg:"This browser cannot decode this file"}; }
    items.push(it);
  }
  const n = $("notice");
  n.hidden = !rejected.length;
  n.replaceChildren(...rejected.map(t => Object.assign(document.createElement("div"),{textContent:"Skipped – "+t})));
  render();
}

function render(){
  $("list").hidden = !items.length;
  $("count").textContent = `${items.length} image${items.length===1?"":"s"}`;
  const list = $("items"); list.innerHTML = "";
  $("go").disabled = $("clear").disabled = !items.length;
  $("zip").disabled = !items.some(i=>i.out);
  items.forEach((it,i) => {
    const d = document.createElement("div"); d.className = "item";
    const dim = it.img.naturalWidth ? ` · ${it.img.naturalWidth}×${it.img.naturalHeight}` : "";
    let status = "";
    if (it.status) status = `<div class="info err">${it.status.msg}</div>`;
    else if (it.out){
      const pct = Math.round(it.out.blob.size/it.file.size*100-100), inf = it.out.info || {};
      const extra = [qualityText(it.out.fmt, inf), inf.resized ? `resized to ${inf.w}×${inf.h}` : ""].filter(Boolean).join(" · ");
      status = `<div class="info ok">→ ${it.out.name} · ${fmtSize(it.out.blob.size)} (${pct>=0?"+":""}${pct}%)${extra ? " · "+extra : ""}</div>`;
      if (inf.miss) status += `<div class="info err">Could not get under ${inf.target} KB; this is the smallest result.</div>`;
    }
    d.innerHTML = `<img src="${it.url}" alt=""><div class="meta"><div class="name"></div><div class="info">${fmtSize(it.file.size)}${dim}</div>${status}</div>`;
    d.querySelector(".name").textContent = it.file.name;
    if (it.out){
      const th = d.querySelector("img"); th.classList.add("zoom"); th.title = "Compare"; th.onclick = () => openCompare(it);
      const cb = document.createElement("button"); cb.textContent = "Compare"; cb.onclick = () => openCompare(it); d.append(cb);
      const a=document.createElement("a"); a.className="dl"; a.href=it.out.url; a.download=it.out.name; a.textContent="Download"; d.append(a);
    }
    const x=document.createElement("button"); x.textContent="✕"; x.title="Remove";
    x.onclick=()=>{ clearOut(it); URL.revokeObjectURL(it.url); items.splice(i,1); render(); };

$("go").onclick = async () => {

  for (const it of todo){
    clearOut(it);
    const label = f => `Converting ${done+1} of ${todo.length} · ${it.file.name}`;
    const step = async f => { setProgress((done+f)/todo.length, label()); await paint(); };
    try {
      const info = {};
      const blob = await convert(it.img, key, step, info);
      const name = it.file.name.replace(/\.[^.]+$/,"") + "." + F.ext;
      it.out = {blob, name, url:URL.createObjectURL(blob), fmt:key, info};
    } catch(e){ it.status = {err:true,msg:e.message}; }
    done++;
    setProgress(done/todo.length, done<todo.length ? `Converted ${done} of ${todo.length}` : "");
    render();
    await paint();
  }
  setProgress(1, `Done · ${todo.length} file${todo.length===1?"":"s"} converted`, true);
  $("go").disabled = false; render();
};

function qualityText(key, inf){
  if (inf.pal) return "256 colours (lossy)";
  if (inf.q != null) return `quality ${inf.q}%` + (inf.target ? ` (fit to ${inf.target} KB)` : "");
  return key === "gif" ? "256-colour palette" : (key === "ico" ? "" : "lossless");
}

/* ---------- before / after compare ---------- */
function openCompare(it){
  if (!it.out) return;
  const dlg = $("cmpDlg"), cmp = $("cmp"), A = $("cmpA"), B = $("cmpB"), err = $("cmpErr"), F = FORMATS[it.out.fmt];
  const ratio = (it.img.naturalWidth/it.img.naturalHeight) || 1;
  cmp.style.aspectRatio = String(ratio);
  cmp.style.width = `min(100%, ${(68*ratio).toFixed(2)}vh)`;
  cmp.hidden = false; err.hidden = true;
  B.onload = () => { cmp.hidden = false; err.hidden = true; };
  B.onerror = () => { cmp.hidden = true; err.hidden = false;
    err.textContent = `This browser can't display ${F.label} files, so there is no preview. The converted file itself is fine.`; };
  A.src = it.url; B.src = it.out.url;
  $("cmpRange").value = 50; setCmp(50);
  $("cmpTitle").textContent = `${it.file.name} → ${it.out.name}`;
  const inf = it.out.info || {};
  const put = (id, title, text) => { const el = $(id); el.querySelector("b").textContent = title; el.querySelector("em").textContent = text; };
  put("statA", "Original", `${fmtSize(it.file.size)} · ${it.img.naturalWidth}×${it.img.naturalHeight}`);
  const dims = inf.w ? ` · ${inf.w}×${inf.h}` : "", qt = qualityText(it.out.fmt, inf);
  put("statB", `Converted · ${F.label}`, `${fmtSize(it.out.blob.size)}${dims}${qt ? " · "+qt : ""}`);
  dlg.showModal();
}
function setCmp(v){
  v = +v;
  $("cmpB").style.clipPath = `inset(0 0 0 ${v}%)`; $("cmpDiv").style.left = v + "%";
  // Original is visible on the left (v%), converted on the right (100-v%).
  const a = $("statA"), b = $("statB");
  a.classList.toggle("on", v >= 50); b.classList.toggle("on", v <= 50);
  a.querySelector(".live").textContent = v > 0 ? `● Showing ${v}%` : "";
  b.querySelector(".live").textContent = v < 100 ? `● Showing ${100-v}%` : "";
}
$("cmpRange").oninput = e => setCmp(e.target.value);
$("cmpClose").onclick = () => $("cmpDlg").close();
$("cmpDlg").addEventListener("click", e => { if (e.target === $("cmpDlg")) $("cmpDlg").close(); });
$("mode").onchange = updateOpts;
$("pngmode").onchange = updateOpts;

let progTimer;
function setProgress(frac, text, finished){
  const p = $("progress"), pct = Math.round(frac*100);
  clearTimeout(progTimer);
  p.hidden = false; p.classList.toggle("done", !!finished);
  $("pbar").style.width = pct + "%";
  $("ppct").textContent = pct + "%";
  if (text) $("ptext").textContent = text;
  p.querySelector("[role=progressbar]").setAttribute("aria-valuenow", pct);
  if (finished) progTimer = setTimeout(() => { p.hidden = true; }, 4000);
}
$("zip").onclick = async () => {
  const seen = new Map(), files = [];
  for (const it of items) if (it.out){
    let n = it.out.name; const c = seen.get(n)||0; seen.set(n,c+1);
    if (c) n = n.replace(/(\.[^.]+)$/, `_${c}$1`);
    files.push({name:n, blob:it.out.blob});
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(await makeZip(files)); a.download = "converted-images.zip"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
};
$("clear").onclick = () => { items.forEach(it=>{clearOut(it);URL.revokeObjectURL(it.url);}); items.length=0; render(); };
fmtSel.onchange = updateOpts;
$("q").oninput = e => $("qv").textContent = e.target.value;
$("scale").oninput = e => $("sv").textContent = e.target.value;
const drop = $("drop"), fileIn = $("file");
drop.onclick = () => fileIn.click();
fileIn.onchange = () => { addFiles(fileIn.files); fileIn.value=""; };
["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e=>{e.preventDefault();drop.classList.add("over");}));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e=>{e.preventDefault();drop.classList.remove("over");}));
drop.addEventListener("drop", e => addFiles(e.dataTransfer.files));
window.addEventListener("paste", e => { const fs=[...e.clipboardData.files]; if(fs.length) addFiles(fs); });
init();
</script>
</body>
